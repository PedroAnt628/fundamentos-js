<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 21: Filtrar por límite</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <a href="../index.html">Volver a la portada</a>
    <h1>Ejercicio 21: Filtrar por límite</h1>
    <p>Muestra el array original, el límite y los números estrictamente mayores que ese límite.</p>
    <label for="numeros">Números:</label>
    <input id="numeros" type="text" value="3, 8, 12, 5, 20">
    <label for="limite">Límite:</label>
    <input id="limite" type="number" value="8">
    <button id="filtrar" type="button">Filtrar</button>
    <div id="salida" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
