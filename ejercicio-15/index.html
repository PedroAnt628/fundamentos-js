<!DOCTYPE html>
<html lang="es">
<head>

<body>

    <h1>Ejercicio 15: Números primos</h1>
    <p>Introduce un límite para mostrar todos los números primos desde 1 hasta ese valor.</p>
    <label for="limite">Límite:</label>
    <input id="limite" type="number" min="1" value="20">
    <button id="generar" type="button">Mostrar primos</button>
    <div id="salida" aria-live="polite"></div>
  </main>

</body>
