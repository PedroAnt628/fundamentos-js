<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 08: Función azar</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <a href="../index.html">Volver a la portada</a>
    <h1>Ejercicio 08: Función azar</h1>
    <p>Genera un número entero aleatorio entre los dos límites, ambos incluidos.</p>
    <label for="minimo">Mínimo:</label>
    <input id="minimo" type="number" value="-5">
    <label for="maximo">Máximo:</label>
    <input id="maximo" type="number" value="10">
    <button id="generar" type="button">Generar cinco números</button>
    <div id="salida" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
